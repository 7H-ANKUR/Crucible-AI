name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: defaultdb
          POSTGRES_USER: avnadmin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff pytest

      - name: Lint (ruff, blocking gate)
        run: ruff check apps/api --select E9,F63,F7,F82

      - name: Byte-compile (import/syntax gate)
        run: python -m compileall -q apps/api

      - name: Dependency conflict check
        run: pip check

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://avnadmin:testpassword@localhost:5432/defaultdb?sslmode=disable
          JWT_SECRET_KEY: test-secret-key-32-chars-long-abc
        run: python scripts/migrate_all.py

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgres://avnadmin:testpassword@localhost:5432/defaultdb?sslmode=disable
          JWT_SECRET_KEY: test-secret-key-32-chars-long-abc
        run: python -m pytest apps/api/tests -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Public fallbacks so the production build compiles in CI without real secrets.
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bmV4dC1ncml6emx5LTQxMjIuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci-placeholder
        run: npm run build
