<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140a"/>
      <stop offset="100%" stop-color="#140d07"/>
    </linearGradient>
    <linearGradient id="backMtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="frontMtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="backCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="frontCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)" stroke="#ea580c" stroke-width="2" stroke-opacity="0.25"/>
  
  <!-- Back mountain -->
  <path d="M 50,25 L 85,85 L 15,85 Z" fill="url(#backMtn)"/>
  <!-- Back snow cap -->
  <path d="M 50,25 L 61.6,45 L 53,42 L 48,48 L 42,40 L 38.3,45 Z" fill="url(#backCap)"/>

  <!-- Front mountain -->
  <path d="M 35,45 L 65,85 L 5,85 Z" fill="url(#frontMtn)"/>
  <!-- Front snow cap -->
  <path d="M 35,45 L 42.5,55 L 38,53 L 32,58 L 27.5,45 Z" fill="url(#frontCap)"/>
  
  <!-- Golden copper base accent -->
  <path d="M 15,85 L 85,85 L 80,75 L 20,75 Z" fill="#f59e0b" opacity="0.45"/>
</svg>
