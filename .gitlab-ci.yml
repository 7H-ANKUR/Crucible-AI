# MINEx CI/CD — GitLab pipeline
#
# NOTE: this repository's origin is GitHub (github.com/7H-ANKUR/SIH26009-MN), so the
# pipeline that actually runs is .github/workflows/ci.yml. This file mirrors that
# pipeline in GitLab CI syntax for portability / GitLab mirrors, per the requested
# gitlab-ci-patterns. Keep the two in sync when either changes.

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NEXT_PUBLIC_API_URL: "http://localhost:8000"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ci-placeholder"
  CLERK_SECRET_KEY: "sk_test_ci-placeholder"

# ---------------- API (Python / FastAPI) ----------------
api:lint:
  stage: lint
  image: python:3.11-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip ruff
  script:
    - ruff check apps/api || true   # non-blocking style gate
  allow_failure: true

api:test:
  stage: test
  image: python:3.11-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r apps/api/requirements.txt
  script:
    - python -m compileall -q apps/api   # import/syntax gate
    - pip check                          # dependency conflict gate

# ---------------- Web (Next.js) ----------------
web:build:
  stage: build
  image: node:20
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - apps/web/node_modules
  before_script:
    - cd apps/web
    - npm ci --legacy-peer-deps
  script:
    - npm run lint
    - npx tsc --noEmit
    - npm run build
  artifacts:
    paths:
      - apps/web/.next
    expire_in: 1 hour
